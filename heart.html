<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Organ 3D</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; background: #f5f5f5; }
    .wrap { display: grid; place-items: center; height: 100%; }
    model-viewer { width: 100%; height: 80vh; background: white; }
    .title { text-align: center; padding: 12px; }
  </style>
</head>
<body>
  <div class="title">
    <h2>Kalp 3D Model</h2>
    <p>Telefonda açıp AR için destekliyorsa "AR" düğmesine basın.</p>
  </div>

  <div class="wrap">
    <model-viewer
      src="VH_M_Heart.glb"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      style="width: 100%; max-width: 900px; height: 70vh;">
    </model-viewer>
  </div>
</body>
</html>
